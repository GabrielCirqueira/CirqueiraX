controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute

# Firewall json_login / refresh_jwt interceptam antes do controller;
# precisam existir como rota (antes o catch-all da SPA cobria isso).
api_auth_login:
    path: /api/v1/auth/login
    methods: [POST]

api_token_refresh:
    path: /api/v1/token/refresh
    methods: [POST]

react_frontend:
  path: /{reactRouting}
  controller: Symfony\Bundle\FrameworkBundle\Controller\TemplateController::templateAction
  defaults:
    template: 'base.html.twig'
  requirements:
    reactRouting: "^(?!api(?:/|$)).+"
