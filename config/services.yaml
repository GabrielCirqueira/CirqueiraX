# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(MEDIA_STORAGE_PATH): './var/storage'
    env(GOOGLE_CLIENT_ID): ''
    env(GOOGLE_CLIENT_SECRET): ''
    env(SYNCTHING_API_URL): 'http://localhost:8384'
    env(SYNCTHING_API_KEY): ''
    env(YTDLP_COOKIES_PATH): ''
    env(PIPER_MODELOS_DIR): '/opt/piper/vozes'
    env(WHISPER_EXECUTAVEL): '/opt/whisper/whisper-cli'
    env(WHISPER_MODELO): '/opt/whisper/modelos/ggml-small-q5_1.bin'
    env(WHISPER_THREADS): '4'
    env(SPOTIFY_CLIENT_ID): ''
    env(SPOTIFY_CLIENT_SECRET): ''
    env(SPOTIFY_REDIRECT_URI): 'http://127.0.0.1:4012/spotify/callback'
    env(OPENAI_API_KEY): ''
    env(YOUTUBE_API_KEY): ''
    env(OPENAI_ESFORCO_RACIOCINIO): 'low'
    env(OPENAI_PRECO_ENTRADA_POR_MILHAO): '0.75'
    env(OPENAI_PRECO_SAIDA_POR_MILHAO): '4.5'
    env(OPENAI_MODELO_TEXTO): 'gpt-5.4-mini'
    env(IA_POOL_PERMITIR_PAGOS): '0'
    env(GROQ_API_KEY): ''
    env(GROQ_MODELO): 'openai/gpt-oss-120b'
    env(GEMINI_API_KEY): ''
    env(GEMINI_MODELO): 'gemini-2.5-flash'
    env(MISTRAL_API_KEY): ''
    env(MISTRAL_MODELO): 'ministral-8b-latest'
    env(OPENROUTER_API_KEY): ''
    env(OPENROUTER_MODELO): 'nvidia/nemotron-3-ultra-550b-a55b:free'
    env(CLOUDFLARE_API_TOKEN): ''
    env(CLOUDFLARE_ACCOUNT_ID): ''
    env(CLOUDFLARE_MODELO): '@@cf/meta/llama-3.3-70b-instruct-fp8-fast'
    env(NVIDIA_API_KEY): ''
    env(NVIDIA_MODELO): 'z-ai/glm-5.3-flash'
    env(ZAI_API_KEY): ''
    env(ZAI_MODELO): 'glm-4.5-flash'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/DataObject/'
            - '../src/Message/'
            - '../src/Security/AgenteUser.php'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Service\Seguranca\CriptografiaService:
        arguments:
            $chaveSecreta: '%env(APP_SECRET)%'

    App\Service\Distribuicao\DistribuirLocalService:
        arguments:
            $mediaStoragePath: '%env(MEDIA_STORAGE_PATH)%'
            $projectDir: '%kernel.project_dir%'

    App\Service\GoogleFotos\GoogleFotosOAuthService:
        arguments:
            $clientId: '%env(GOOGLE_CLIENT_ID)%'
            $clientSecret: '%env(GOOGLE_CLIENT_SECRET)%'

    App\Service\GoogleFotos\AutorizarContaGoogleFotosService:
        arguments:
            $clientId: '%env(GOOGLE_CLIENT_ID)%'
            $clientSecret: '%env(GOOGLE_CLIENT_SECRET)%'

    App\Interface\ArmazenamentoInterface: '@App\Infra\Storage\ArmazenamentoLocalClient'
    App\Interface\MetadataImagemInterface: '@App\Infra\Imagem\MetadataImagemClient'
    App\Interface\ArmazenamentoLivroInterface: '@App\Infra\Storage\ArmazenamentoLivroClient'
    App\Interface\ExtratorTextoPdfInterface: '@App\Infra\Pdf\ExtratorTextoPdfClient'
    App\Interface\SintetizadorVozInterface: '@App\Infra\Audio\SintetizadorVozRoteador'

    App\Service\Musica\Capa\ObterCapaMusicaService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Infra\YoutubeMusic\YoutubeMusicClient:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Infra\Audio\EdgeTtsClient:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Infra\Audio\PiperTtsClient:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $diretorioModelos: '%env(PIPER_MODELOS_DIR)%'

    App\Service\LivroAudio\GerenciarVozesLivroAudioService:
        arguments:
            $diretorioBaseLivros: '%kernel.project_dir%/var/livros'

    App\Infra\Storage\ArmazenamentoLivroClient:
        arguments:
            $diretorioBaseLivros: '%kernel.project_dir%/var/livros'

    App\Service\LivroAudio\PainelSistemaLivrosAudioService:
        arguments:
            $diretorioBaseLivros: '%kernel.project_dir%/var/livros'

    App\Service\MediaItem\ClassificarMediaItemService:
        arguments:
            $mediaStoragePath: '%env(MEDIA_STORAGE_PATH)%'
            $projectDir: '%kernel.project_dir%'

    App\Service\Video\BaixarVideoDownloadService:
        arguments:
            $mediaStoragePath: '%env(MEDIA_STORAGE_PATH)%'
            $projectDir: '%kernel.project_dir%'

    App\Infra\YtDlp\YtDlpClient:
        arguments:
            $cookiesPath: '%env(YTDLP_COOKIES_PATH)%'
            $projectDir: '%kernel.project_dir%'

    App\Service\Audio\BaixarAudioService:
        arguments:
            $diretorioAudios: '%kernel.project_dir%/var/audios'

    App\Service\MediaItem\RebaixarMediaItemService:
        arguments:
            $mediaStoragePath: '%env(MEDIA_STORAGE_PATH)%'
            $projectDir: '%kernel.project_dir%'

    GuzzleHttp\ClientInterface: '@guzzle.default'

    guzzle.default:
        class: GuzzleHttp\Client

    guzzle.google_photos:
        class: GuzzleHttp\Client
        arguments:
            - { base_uri: 'https://photoslibrary.googleapis.com' }

    guzzle.google_oauth:
        class: GuzzleHttp\Client
        arguments:
            - { base_uri: 'https://oauth2.googleapis.com' }

    guzzle.youtube_data:
        class: GuzzleHttp\Client
        arguments:
            - { base_uri: 'https://www.googleapis.com/youtube/v3/' }

    App\Interface\YoutubeDataInterface: '@App\Infra\YoutubeData\YoutubeDataClient'

    App\Infra\YoutubeData\YoutubeDataClient:
        arguments:
            $client: '@guzzle.youtube_data'
            $chaveApi: '%env(YOUTUBE_API_KEY)%'

    App\Infra\GoogleFotos\GoogleFotosAPI:
        arguments:
            $client: '@guzzle.google_photos'
            $baseUrl: 'https://photoslibrary.googleapis.com'

    App\Infra\GoogleOAuth\GoogleOAuthAPI:
        arguments:
            $client: '@guzzle.google_oauth'
            $baseUrl: 'https://oauth2.googleapis.com'

    App\Interface\SyncthingClientInterface: '@App\Infra\Syncthing\SyncthingClient'

    App\Infra\Syncthing\SyncthingClient:
        arguments:
            $client: '@guzzle.default'
            $apiUrl: '%env(SYNCTHING_API_URL)%'
            $apiKey: '%env(SYNCTHING_API_KEY)%'

    App\Interface\SpotifyInterface: '@App\Infra\Spotify\SpotifyClient'
    App\Interface\TranscritorAudioInterface: '@App\Infra\Transcricao\WhisperCppClient'
    App\Interface\ArmazenamentoTranscricaoInterface: '@App\Infra\Storage\ArmazenamentoTranscricaoClient'
    App\Interface\ExtratorAudioVideoInterface: '@App\Infra\Transcricao\ExtratorAudioFfmpegClient'
    App\Interface\CorretorTextoTranscricaoInterface: '@App\Infra\OpenAi\OpenAiCorretorTextoClient'

    App\Interface\IdentificadorMusicaInterface: '@App\Service\IdentificacaoMusica\Ia\IdentificarMusicasComIaService'

    App\Service\Ia\ListarProvedoresIaService:
        arguments:
            $provedores: !tagged_iterator { tag: !php/const App\Interface\ProvedorIaInterface::TAG }
            $permitirPagos: '%env(bool:IA_POOL_PERMITIR_PAGOS)%'

    app.provedor_ia.groq:
        class: App\Infra\Ia\ProvedorIaCompativelOpenAiClient
        arguments:
            $provedor: !php/enum App\Enum\ProvedorIa::Groq
            $urlBase: 'https://api.groq.com/openai/v1'
            $chaveApi: '%env(GROQ_API_KEY)%'
            $modelo: '%env(GROQ_MODELO)%'
            $aceitaEsquemaEstrito: false
            $timeoutSegundos: 60.0
        tags:
            - { name: !php/const App\Interface\ProvedorIaInterface::TAG, priority: 80 }

    app.provedor_ia.gemini:
        class: App\Infra\Ia\ProvedorIaCompativelOpenAiClient
        arguments:
            $provedor: !php/enum App\Enum\ProvedorIa::Gemini
            $urlBase: 'https://generativelanguage.googleapis.com/v1beta/openai'
            $chaveApi: '%env(GEMINI_API_KEY)%'
            $modelo: '%env(GEMINI_MODELO)%'
            $aceitaEsquemaEstrito: true
            $timeoutSegundos: 90.0
        tags:
            - { name: !php/const App\Interface\ProvedorIaInterface::TAG, priority: 70 }

    app.provedor_ia.mistral:
        class: App\Infra\Ia\ProvedorIaCompativelOpenAiClient
        arguments:
            $provedor: !php/enum App\Enum\ProvedorIa::Mistral
            $urlBase: 'https://api.mistral.ai/v1'
            $chaveApi: '%env(MISTRAL_API_KEY)%'
            $modelo: '%env(MISTRAL_MODELO)%'
            $aceitaEsquemaEstrito: true
            $timeoutSegundos: 60.0
        tags:
            - { name: !php/const App\Interface\ProvedorIaInterface::TAG, priority: 60 }

    app.provedor_ia.openrouter:
        class: App\Infra\Ia\ProvedorIaCompativelOpenAiClient
        arguments:
            $provedor: !php/enum App\Enum\ProvedorIa::OpenRouter
            $urlBase: 'https://openrouter.ai/api/v1'
            $chaveApi: '%env(OPENROUTER_API_KEY)%'
            $modelo: '%env(OPENROUTER_MODELO)%'
            $aceitaEsquemaEstrito: true
            $timeoutSegundos: 90.0
        tags:
            - { name: !php/const App\Interface\ProvedorIaInterface::TAG, priority: 50 }

    app.provedor_ia.cloudflare:
        class: App\Infra\Ia\ProvedorIaCompativelOpenAiClient
        arguments:
            $provedor: !php/enum App\Enum\ProvedorIa::Cloudflare
            $urlBase: 'https://api.cloudflare.com/client/v4/accounts/%env(CLOUDFLARE_ACCOUNT_ID)%/ai/v1'
            $chaveApi: '%env(CLOUDFLARE_API_TOKEN)%'
            $modelo: '%env(CLOUDFLARE_MODELO)%'
            $aceitaEsquemaEstrito: true
            $timeoutSegundos: 90.0
        tags:
            - { name: !php/const App\Interface\ProvedorIaInterface::TAG, priority: 40 }

    app.provedor_ia.nvidia:
        class: App\Infra\Ia\ProvedorIaCompativelOpenAiClient
        arguments:
            $provedor: !php/enum App\Enum\ProvedorIa::Nvidia
            $urlBase: 'https://integrate.api.nvidia.com/v1'
            $chaveApi: '%env(NVIDIA_API_KEY)%'
            $modelo: '%env(NVIDIA_MODELO)%'
            $aceitaEsquemaEstrito: false
            $timeoutSegundos: 180.0
        tags:
            - { name: !php/const App\Interface\ProvedorIaInterface::TAG, priority: 30 }

    app.provedor_ia.zai:
        class: App\Infra\Ia\ProvedorIaCompativelOpenAiClient
        arguments:
            $provedor: !php/enum App\Enum\ProvedorIa::Zai
            $urlBase: 'https://api.z.ai/api/paas/v4'
            $chaveApi: '%env(ZAI_API_KEY)%'
            $modelo: '%env(ZAI_MODELO)%'
            $aceitaEsquemaEstrito: false
            $timeoutSegundos: 180.0
        tags:
            - { name: !php/const App\Interface\ProvedorIaInterface::TAG, priority: 20 }

    app.provedor_ia.openai:
        class: App\Infra\Ia\ProvedorIaCompativelOpenAiClient
        arguments:
            $provedor: !php/enum App\Enum\ProvedorIa::OpenAi
            $urlBase: 'https://api.openai.com/v1'
            $chaveApi: '%env(OPENAI_API_KEY)%'
            $modelo: '%env(OPENAI_MODELO_TEXTO)%'
            $aceitaEsquemaEstrito: true
            $timeoutSegundos: 60.0
            $precoEntradaPorMilhao: '%env(float:OPENAI_PRECO_ENTRADA_POR_MILHAO)%'
            $precoSaidaPorMilhao: '%env(float:OPENAI_PRECO_SAIDA_POR_MILHAO)%'
            $parametrosAdicionais:
                reasoning_effort: '%env(OPENAI_ESFORCO_RACIOCINIO)%'
            $campoLimiteTokens: 'max_completion_tokens'
        tags:
            - { name: !php/const App\Interface\ProvedorIaInterface::TAG, priority: 10 }


    App\Infra\OpenAi\OpenAiCorretorTextoClient:
        arguments:
            $chaveApi: '%env(OPENAI_API_KEY)%'
            $modelo: '%env(OPENAI_MODELO_TEXTO)%'

    App\Infra\Transcricao\WhisperCppClient:
        arguments:
            $executavelWhisper: '%env(WHISPER_EXECUTAVEL)%'
            $caminhoModelo: '%env(WHISPER_MODELO)%'
            $diretorioTemporario: '%kernel.project_dir%/var/tmp'
            $threads: '%env(int:WHISPER_THREADS)%'

    App\Infra\Storage\ArmazenamentoTranscricaoClient:
        arguments:
            $diretorioBaseTranscricoes: '%kernel.project_dir%/var/transcricoes'
    App\Interface\LeitorArquivoHistoricoSpotifyInterface: '@App\Infra\Spotify\LeitorArquivoHistoricoSpotify'
    App\Interface\ArmazenamentoImportacaoSpotifyInterface: '@App\Infra\Spotify\ArmazenamentoImportacaoSpotifyClient'
    App\Interface\LeitorStreamObjetosJsonInterface: '@App\Infra\Json\LeitorStreamObjetosJson'
    App\Interface\LeitorArquivoTakeoutYoutubeInterface: '@App\Infra\YoutubeMusic\LeitorArquivoTakeoutYoutube'
    App\Interface\ArmazenamentoImportacaoYoutubeInterface: '@App\Infra\YoutubeMusic\ArmazenamentoImportacaoYoutubeClient'

    App\Infra\YoutubeMusic\ArmazenamentoImportacaoYoutubeClient:
        arguments:
            $diretorioTemporario: '%kernel.project_dir%/var/tmp/youtube_importacoes'

    App\Infra\Spotify\ArmazenamentoImportacaoSpotifyClient:
        arguments:
            $diretorioTemporario: '%kernel.project_dir%/var/tmp/spotify_importacoes'

    guzzle.spotify:
        class: GuzzleHttp\Client
        arguments:
            - { timeout: 15.0 }

    App\Infra\Spotify\SpotifyClient:
        arguments:
            $client: '@guzzle.spotify'
            $clientId: '%env(SPOTIFY_CLIENT_ID)%'
            $clientSecret: '%env(SPOTIFY_CLIENT_SECRET)%'
            $redirectUri: '%env(SPOTIFY_REDIRECT_URI)%'
            $baseUrl: 'https://api.spotify.com/v1'


