# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(MEDIA_STORAGE_PATH): './var/storage'
    env(GOOGLE_CLIENT_ID): ''
    env(GOOGLE_CLIENT_SECRET): ''
    env(SYNCTHING_API_URL): 'http://localhost:8384'
    env(SYNCTHING_API_KEY): ''
    env(YTDLP_COOKIES_PATH): ''
    env(PIPER_MODELOS_DIR): '/opt/piper/vozes'
    env(SPOTIFY_CLIENT_ID): ''
    env(SPOTIFY_CLIENT_SECRET): ''
    env(SPOTIFY_REDIRECT_URI): 'http://127.0.0.1:4012/spotify/callback'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/DataObject/'
            - '../src/Message/'
            - '../src/Security/AgenteUser.php'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Service\Seguranca\CriptografiaService:
        arguments:
            $chaveSecreta: '%env(APP_SECRET)%'

    App\Service\Distribuicao\DistribuirLocalService:
        arguments:
            $mediaStoragePath: '%env(MEDIA_STORAGE_PATH)%'
            $projectDir: '%kernel.project_dir%'

    App\Service\GoogleFotos\GoogleFotosOAuthService:
        arguments:
            $clientId: '%env(GOOGLE_CLIENT_ID)%'
            $clientSecret: '%env(GOOGLE_CLIENT_SECRET)%'

    App\Service\GoogleFotos\AutorizarContaGoogleFotosService:
        arguments:
            $clientId: '%env(GOOGLE_CLIENT_ID)%'
            $clientSecret: '%env(GOOGLE_CLIENT_SECRET)%'

    App\Interface\ArmazenamentoInterface: '@App\Infra\Storage\ArmazenamentoLocalClient'
    App\Interface\MetadataImagemInterface: '@App\Infra\Imagem\MetadataImagemClient'
    App\Interface\ArmazenamentoLivroInterface: '@App\Infra\Storage\ArmazenamentoLivroClient'
    App\Interface\ExtratorTextoPdfInterface: '@App\Infra\Pdf\ExtratorTextoPdfClient'
    App\Interface\SintetizadorVozInterface: '@App\Infra\Audio\SintetizadorVozRoteador'

    App\Infra\Audio\EdgeTtsClient:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Infra\Audio\PiperTtsClient:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $diretorioModelos: '%env(PIPER_MODELOS_DIR)%'

    App\Service\LivroAudio\GerenciarVozesLivroAudioService:
        arguments:
            $diretorioBaseLivros: '%kernel.project_dir%/var/livros'

    App\Infra\Storage\ArmazenamentoLivroClient:
        arguments:
            $diretorioBaseLivros: '%kernel.project_dir%/var/livros'

    App\Service\LivroAudio\PainelSistemaLivrosAudioService:
        arguments:
            $diretorioBaseLivros: '%kernel.project_dir%/var/livros'

    App\Service\MediaItem\ClassificarMediaItemService:
        arguments:
            $mediaStoragePath: '%env(MEDIA_STORAGE_PATH)%'
            $projectDir: '%kernel.project_dir%'

    App\Service\Video\BaixarVideoDownloadService:
        arguments:
            $mediaStoragePath: '%env(MEDIA_STORAGE_PATH)%'
            $projectDir: '%kernel.project_dir%'

    App\Infra\YtDlp\YtDlpClient:
        arguments:
            $cookiesPath: '%env(YTDLP_COOKIES_PATH)%'
            $projectDir: '%kernel.project_dir%'

    App\Service\Audio\BaixarAudioService:
        arguments:
            $diretorioAudios: '%kernel.project_dir%/var/audios'

    App\Service\MediaItem\RebaixarMediaItemService:
        arguments:
            $mediaStoragePath: '%env(MEDIA_STORAGE_PATH)%'
            $projectDir: '%kernel.project_dir%'

    GuzzleHttp\ClientInterface: '@guzzle.default'

    guzzle.default:
        class: GuzzleHttp\Client

    guzzle.google_photos:
        class: GuzzleHttp\Client
        arguments:
            - { base_uri: 'https://photoslibrary.googleapis.com' }

    guzzle.google_oauth:
        class: GuzzleHttp\Client
        arguments:
            - { base_uri: 'https://oauth2.googleapis.com' }

    App\Infra\GoogleFotos\GoogleFotosAPI:
        arguments:
            $client: '@guzzle.google_photos'
            $baseUrl: 'https://photoslibrary.googleapis.com'

    App\Infra\GoogleOAuth\GoogleOAuthAPI:
        arguments:
            $client: '@guzzle.google_oauth'
            $baseUrl: 'https://oauth2.googleapis.com'

    App\Interface\SyncthingClientInterface: '@App\Infra\Syncthing\SyncthingClient'

    App\Infra\Syncthing\SyncthingClient:
        arguments:
            $client: '@guzzle.default'
            $apiUrl: '%env(SYNCTHING_API_URL)%'
            $apiKey: '%env(SYNCTHING_API_KEY)%'

    App\Interface\SpotifyInterface: '@App\Infra\Spotify\SpotifyClient'
    App\Interface\LeitorArquivoHistoricoSpotifyInterface: '@App\Infra\Spotify\LeitorArquivoHistoricoSpotify'
    App\Interface\ArmazenamentoImportacaoSpotifyInterface: '@App\Infra\Spotify\ArmazenamentoImportacaoSpotifyClient'

    App\Infra\Spotify\ArmazenamentoImportacaoSpotifyClient:
        arguments:
            $diretorioTemporario: '%kernel.project_dir%/var/tmp/spotify_importacoes'

    guzzle.spotify:
        class: GuzzleHttp\Client
        arguments:
            - { timeout: 15.0 }

    App\Infra\Spotify\SpotifyClient:
        arguments:
            $client: '@guzzle.spotify'
            $clientId: '%env(SPOTIFY_CLIENT_ID)%'
            $clientSecret: '%env(SPOTIFY_CLIENT_SECRET)%'
            $redirectUri: '%env(SPOTIFY_REDIRECT_URI)%'
            $baseUrl: 'https://api.spotify.com/v1'


