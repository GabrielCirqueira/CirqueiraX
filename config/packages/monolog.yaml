monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - ingestao
        - google_fotos
        - syncthing

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event", "!ingestao", "!google_fotos", "!syncthing"]
            ingestao:
                type: stream
                path: "%kernel.logs_dir%/ingestao.log"
                level: debug
                channels: ["ingestao"]
            google_fotos:
                type: stream
                path: "%kernel.logs_dir%/google_fotos.log"
                level: debug
                channels: ["google_fotos"]
            syncthing:
                type: stream
                path: "%kernel.logs_dir%/syncthing.log"
                level: debug
                channels: ["syncthing"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
                formatter: monolog.formatter.json
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
