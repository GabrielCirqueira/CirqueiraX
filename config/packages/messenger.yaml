framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    use_notify: true
                    check_delayed_interval: 60000
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            livro_audio:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: livro_audio
                    use_notify: true
                    check_delayed_interval: 60000
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            spotify_importacao:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: spotify_importacao
                    use_notify: true
                    check_delayed_interval: 60000
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            transcricao:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: transcricao
                    use_notify: true
                    check_delayed_interval: 60000
                    redeliver_timeout: 50400
                retry_strategy:
                    max_retries: 1
                    multiplier: 2
            youtube_coleta:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: youtube_coleta
                    use_notify: true
                    check_delayed_interval: 60000
                retry_strategy:
                    max_retries: 0
            failed: 'doctrine://default?queue_name=failed'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            'App\Message\ProcessarLivroAudioMessage': livro_audio
            'App\Message\GerarAudioBlocoMessage': livro_audio
            'App\Message\GerarAudioBlocoVozMessage': livro_audio
            'App\Message\ImportarHistoricoSpotifyMessage': spotify_importacao
            'App\Message\TranscreverAudioMessage': transcricao
            'App\Message\ColetarHistoricoYoutubeMusicMessage': youtube_coleta
            'App\Message\*': async


